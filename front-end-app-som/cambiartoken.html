  <!DOCTYPE html>
  <html>
    <head>
      <script>
        document.write('<link href="css/icon.css?v=' + Date.now() + '" rel="stylesheet">');
        document.write('<link type="text/css" rel="stylesheet" href="css/materialize.min.css?v=' + Date.now() + '" media="screen,projection">');
      </script>
      <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
      <script src="js/jquery.min.js"></script>
      <script>
        document.write('<script src="js/scripts.js?v=' + Date.now() + '"><\/script>');
      </script>
      <script src="js/core.js"></script>
      <script src="js/md5.js"></script>
      <script type="text/javascript" charset="utf-8" src="cordova.js"></script>
      <meta charset="UTF-8">
      <meta name="color-scheme" content="light only">
      <script type="text/javascript">

        window.addEventListener("DOMContentLoaded", () => {
          const dirExacta = document.getElementById("dirExacta");
          const infoContacto = document.getElementById("infoContacto");

          // Solo setea si la clave existe en localStorage
          if (localStorage.getItem("dirExacta") !== null) {
            dirExacta.checked = localStorage.getItem("dirExacta") === "true";
          }

          if (localStorage.getItem("infoContacto") !== null) {
            infoContacto.checked = localStorage.getItem("infoContacto") === "true";
          }
        });

        $(document).ready(function(){
          $('.collapsible').collapsible();
        });

        function cargar()
        {
          var token = obtenerParametros('token');
          $('#token').val(token);
        }

        function iniciar()
        {
          var status = navigator.onLine;
          if (!status) {
              alert('Es necesario conectarse a internet para continuar. Revise su conexión y reintente.');
              window.close();
          } else {
            var token = localStorage.getItem('token');
            var inmo = localStorage.getItem('inmobiliaria');
            var suc = localStorage.getItem('sucursal');
            var rol = localStorage.getItem('rol');

            if(token !== null)
            {
              window.location.href = "busqueda.html?token=" + token + "&inmobiliaria=" + inmo + "&sucursal=" + suc + "&rol=" + rol;
            }
          }
        }

        function GuardarConfiguracion()
        {
          var token = $('#token').val();
          if(token !== "")
          {
            M.toast({html: 'Guardando sus datos...'});

            const dirExactaChecked = document.getElementById("dirExacta").checked;
            const infoContactoChecked = document.getElementById("infoContacto").checked;

            // Guardarlos en localStorage
            localStorage.setItem("dirExacta", dirExactaChecked);
            localStorage.setItem("infoContacto", infoContactoChecked);
            

            localStorage.setItem('token', token);

            var request = new XMLHttpRequest();

            url = 'https://apmovil.' + baseurl + '/InmobiliariasServiceV2.aspx?token=' + token;

            request.open('GET', url, true);

            request.onload = function() {

              var login = JSON.parse(this.response);

              if (request.status >= 200 && request.readyState == 4) {
                if(!Boolean(login))
                {
                  M.toast({html: 'Los datos ingresados no son correctos.'});  
                }
                else
                {
                  if(login.codigo !== "")
                  {
                    localStorage.setItem('inmobiliaria', login.inmobiliaria);
                    localStorage.setItem('sucursal', login.sucursal);
                    localStorage.setItem('rol', login.rolUsuario);
                    window.location.href = "busqueda.html?token=" + token + "&inmobiliaria=" + login.inmobiliaria + "&sucursal=" + login.sucursal + "&rol=" + login.rolUsuario;
                  }
                }
                
              }
            }

            request.send();
          }
          else
          {
            M.toast({html: 'Debe ingresar un token para continuar.'});
          }
        }
      </script>
    </head>

    <body class="fondo" onload="cargar()">

      <div class="row">
        <div class="col s12 center-align">

            <img src="images/logo.png" class="responsive-img" style="margin-top: 20px; margin-bottom: 30px">

            <h4><i class="material-icons">settings</i> Configuración</h4>

            <div class="padding">
              <ul class="collapsible">
                <li class="active">
                  <div class="collapsible-header"><i class="material-icons">vpn_key</i>Token de seguridad</div>
                  <div class="collapsible-body"><span>
                    <div class="row">
                    <div class="input-field col s12 padding">
                      <br>
                      <input type="text" id="token" style="height: 35px; width: 100%; font-size: 20px" placeholder="">
                      <label for="token">Ingrese su Token</label>
                    </div>
                    </div>
                  </span></div>
                </li>
                <li>
                  <div class="collapsible-header"><i class="material-icons">person</i>Preferencias</div>
                  <div class="collapsible-body left-align"><span>
                    <div class="row padding">
                    <div class="switch">
                      <label>
                        <span style="font-size: 14px;">Enviar dirección exacta</span>
                        <input type="checkbox" id="dirExacta">
                        <span class="lever"></span>
                      </label>
                    </div>
                    <br>
                    <div class="switch">
                      <label>
                        <span style="font-size: 14px;">Compartir información de contacto</span>
                        <input type="checkbox" id="infoContacto" checked>
                        <span class="lever"></span>
                      </label>
                    </div>
                    </div>
                  </span></div>
                </li>
              </ul>
            </div>
            <br>
            <a href="javascript:iniciar()" class="margin btn blue-grey"><i class="material-icons left">arrow_back</i>Salir</a>

            <a href="javascript:GuardarConfiguracion();" class="margin btn blue-grey"><i class="material-icons right">save</i>Grabar</a>
        </div>
        <div class="col s12 center-align" id="version">
          
        </div>
      </div>
      <script type="text/javascript">
        $("#version").html("");
        var mensajeOS = "Apple iOS - ";

        if(isAndroid)
        {
          mensajeOS = "Android - ";
        }

        $("#version").append("<br><br><br><span>Versión de la aplicación: <b class='red-text'>" + mensajeOS + versionAPP  + "</b></span>");
      </script>
      <script type="text/javascript" src="js/materialize.min.js"></script>
    </body>
  </html>
